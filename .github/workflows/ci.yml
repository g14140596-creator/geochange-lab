name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,api]"
      - run: ruff check geochangelab tests scripts
      - run: pytest
      - run: python -c "from geochangelab.api import app; assert app.title == 'GeoChange Lab API'"
      - run: python scripts/generate_demo.py
